# Playerctl options
set -g @short_length "15"
set -g @status_playing ""
set -g @status_paused " "
set -g @status_stopped " Stopped"


# run '~/.tmux/plugins/tmux/catppuccin.tmux'

set-option -g status-position bottom 

# Left
set -g status-left ""
set -ag status-left "#[bg=#{?client_prefix,#{E:@thm_red},#{@thm_surface_0}},fg=#{@thm_bg}]#[reverse]#[noreverse]"
set -ag status-left "#[fg=#{@thm_black},bg=#{?client_prefix,#{E:@thm_red},#{@thm_surface_0}}]🌸"
set -ag status-left "#[fg=#{@thm_bg},bg=#{?client_prefix,#{E:@thm_red},#{@thm_surface_0}},reverse]#[none]"
set -ag status-left "#[bg=#{@thm_bg}]"
set -ag status-left "#{E:@catppuccin_status_session} "

# Load average
set -ag status-left "#[bg=#{@thm_peach},fg=#{@thm_bg}]#[reverse]#{@catppuccin_status_left_separator}#[noreverse] "
set -ag status-left "#[fg=#{@thm_fg},bg=#{@thm_surface_0}] #(awk -v n=$(nproc) '{printf \"%.2f\", $1/n}' /proc/loadavg)"
set -ag status-left "#[fg=#{@thm_bg},bg=#{@thm_surface_0},reverse]#{@catppuccin_status_right_separator}#[none]"
set -ag status-left "#[bg=#{@thm_bg}] "

# RAM
set -ag status-left "#[bg=#{@thm_mauve},fg=#{@thm_bg}]#[reverse]#{@catppuccin_status_left_separator}#[noreverse]󰍛 "
set -ag status-left "#[fg=#{@thm_fg},bg=#{@thm_surface_0}] #(free -m | awk '/^Mem:/ {print int($3/$2*100)}')%%"
set -ag status-left "#[fg=#{@thm_bg},bg=#{@thm_surface_0},reverse]#{@catppuccin_status_right_separator}#[none]"
set -ag status-left "#[bg=#{@thm_bg}] "

# Disk /
set -ag status-left "#[bg=#{@thm_sky},fg=#{@thm_bg}]#[reverse]#{@catppuccin_status_left_separator}#[noreverse]󰋊 "
set -ag status-left "#[fg=#{@thm_fg},bg=#{@thm_surface_0}] #(df -P / | awk 'NR==2 {print int($3/($3+$4)*100)}')%%"
set -ag status-left "#[fg=#{@thm_bg},bg=#{@thm_surface_0},reverse]#{@catppuccin_status_right_separator}#[none]"
set -ag status-left "#[bg=#{@thm_bg}] "


# Right
# set -gF status-right "#{E:@catppuccin_status_weather} "
set -g status-right "#[bg=#{@thm_flamingo},fg=#{@thm_bg}]#[reverse]#[noreverse]󰭦 "
set -ag status-right "#[fg=#{@thm_fg},bg=#{@thm_surface_0}] %d.%m.%Y"
set -ag status-right "#[fg=#{@thm_bg},bg=#{@thm_surface_0},reverse]#[none]"
set -ag status-right "#{E:@catppuccin_status_date_time}"
set -ag status-right "#[bg=#{@thm_bg}] "
