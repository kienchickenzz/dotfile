# Palette
set -g @c_session  "#{@thm_mauve}"
set -g @c_player   "#{@thm_pink}"
set -g @c_weather  "#{@thm_teal}"
set -g @c_date     "#{@thm_sapphire}"
set -g @c_time     "#{@thm_lavender}"

set -g @batt_color_full_charge  "#{@thm_green}"
set -g @batt_color_high_charge  "#{@thm_green}"
set -g @batt_color_medium_charge "#{@thm_peach}"
set -g @batt_color_low_charge   "#{@thm_red}"


# Separator (fallback if catppuccin don't set)
set -g @catppuccin_status_left_separator ""
set -g @catppuccin_status_right_separator ""


# Playerctl options
set -g @short_length "15"
set -g @status_playing ""
set -g @status_paused " "
set -g @status_stopped " Stopped"


# run '~/.tmux/plugins/tmux/catppuccin.tmux'

# Position
set-option -g status-position bottom 
set -g status-interval 60


# ----------
# Left
# ----------
set -g status-left ""

# Prefix indicator
set -ag status-left "#[bg=#{?client_prefix,#{E:@thm_red},#{@thm_surface_0}},fg=#{@thm_bg}]#[reverse]#{@catppuccin_status_left_separator}#[noreverse]"
set -ag status-left "#[fg=#{@thm_black},bg=#{?client_prefix,#{E:@thm_red},#{@thm_surface_0}}]🌸"
set -ag status-left "#[fg=#{@thm_bg},bg=#{?client_prefix,#{E:@thm_red},#{@thm_surface_0}},reverse]#{@catppuccin_status_right_separator}#[none]"
set -ag status-left "#[bg=#{@thm_bg}]"

# Session
set -ag status-left "#[bg=#{E:@c_session},fg=#{@thm_bg}]#[reverse]#{@catppuccin_status_left_separator}#[noreverse] "
set -ag status-left "#[fg=#{@thm_fg},bg=#{@thm_surface_0}] #{session_name}"
set -ag status-left "#[fg=#{@thm_bg},bg=#{@thm_surface_0},reverse]#{@catppuccin_status_right_separator}#[none]"
set -ag status-left "#[bg=#{@thm_bg}] "

# Player
set -ag status-left "#[bg=#{E:@c_player},fg=#{@thm_bg}]#[reverse]#{@catppuccin_status_left_separator}#[noreverse] "
set -ag status-left "#[fg=#{@thm_fg},bg=#{@thm_surface_0}] #{playerctl_status} #{playerctl_short}"
set -ag status-left "#[fg=#{@thm_bg},bg=#{@thm_surface_0},reverse]#{@catppuccin_status_right_separator}#[none]"
set -ag status-left "#[bg=#{@thm_bg}] "

# Battery
set -g @batt_icon_charge_tier8 "󰁹"
set -g @batt_icon_charge_tier6 "󰂀"
set -g @batt_icon_charge_tier4 "󰁾"
set -g @batt_icon_charge_tier2 "󰁼"

set -g @batt_icon_status_charged     "󰚥"
set -g @batt_icon_status_charging    "󰚥"
set -g @batt_icon_status_discharging ""
set -g @batt_icon_status_attached    ""
set -g @batt_icon_status_unknown     ""

set -g @batt_pct "#{s|%||:#{battery_percentage}}"
set -g @batt_bg "#{?#{e|<:#{E:@batt_pct},20},#{@thm_red},#{?#{e|<:#{E:@batt_pct},50},#{@thm_peach},#{@thm_green}}}"

set -ag status-left "#[bg=#{E:@batt_bg},fg=#{@thm_bg}]#[reverse]#{@catppuccin_status_left_separator}#[noreverse]#{battery_icon_charge}#{battery_icon_status} "
set -ag status-left "#[fg=#{@thm_fg},bg=#{@thm_surface_0}] #{battery_percentage}"
set -ag status-left "#[fg=#{@thm_bg},bg=#{@thm_surface_0},reverse]#{@catppuccin_status_right_separator}#[none]"
set -ag status-left "#[bg=#{@thm_bg}] "

# ----------
# Right
# ----------

# Weather
set -g  status-right "#[bg=#{E:@c_weather},fg=#{@thm_bg}]#[reverse]#{@catppuccin_status_left_separator}#[noreverse]󰔏 "
set -ag status-right "#[fg=#{@thm_fg},bg=#{@thm_surface_0}] #{weather}"
set -ag status-right "#[fg=#{@thm_bg},bg=#{@thm_surface_0},reverse]#{@catppuccin_status_right_separator}#[none]"
set -ag status-right "#[bg=#{@thm_bg}] "

# Calendar
set -ag status-right "#[bg=#{E:@c_date},fg=#{@thm_bg}]#[reverse]#{@catppuccin_status_left_separator}#[noreverse]󰭦 "
set -ag status-right "#[fg=#{@thm_fg},bg=#{@thm_surface_0}] %d.%m.%Y"
set -ag status-right "#[fg=#{@thm_bg},bg=#{@thm_surface_0},reverse]#{@catppuccin_status_right_separator}#[none]"
set -ag status-right "#[bg=#{@thm_bg}] "

# Datetime
set -ag status-right "#[bg=#{E:@c_time},fg=#{@thm_bg}]#[reverse]#{@catppuccin_status_left_separator}#[noreverse]󰥔 "
set -ag status-right "#[fg=#{@thm_fg},bg=#{@thm_surface_0}] %H:%M"
set -ag status-right "#[fg=#{@thm_bg},bg=#{@thm_surface_0},reverse]#{@catppuccin_status_right_separator}#[none]"
set -ag status-right "#[bg=#{@thm_bg}] "
